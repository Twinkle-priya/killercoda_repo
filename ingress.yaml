apiversion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twinkle-ingress
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: vegetable-order-app
  rules:
    - http:
        paths:
          - path: /vegetable-order-app(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: my-service
                port:
                  number: 3000