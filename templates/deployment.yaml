apiVersion: apps/v1
kind: Deployment
metadata: 
  name: {{.Release.name}}-dep
  labels: 
    first: app
spec: # Behaviour of the replicaset
  replicas: {{.Values.replicas}}
  selector: 
    matchLabels: 
      app: web
  template:
    metadata: 
      labels: 
        app: {{.Values.labels.web}}
    spec: # behaviour fo the pod
      containers: 
        - name: {{.Values.container.name}}
          image: {{.Values.container.image}}
          ports:
            - containerPort: {{.Values.container.port}}
          envFrom: 
            - ConfigMapRef: 
                name: {{.Values.configMap.name}}
              secretRef: 
                name: {{.Values.secret.name}}
---                

apiVersion: v1
kind: Service
metadata: 
  name: {{.Values.service.name}}
spec:
  selector: 
    app: web
ports:
  - protocol: TCP
    port: {{.Values.service.port}}
    targetPort: {{.Values.service.targetport}}
type: {{.Values.service.type}}

  







