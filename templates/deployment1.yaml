apiVersion: apps/v1
kind: Deployment

metadata:
  name: icoder
  labels:
    first: app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: twinkle-container
          image: twinklepriya/icoder-app
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: icoder-service

spec:
  type: NodePort

  selector:
    app: web

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007